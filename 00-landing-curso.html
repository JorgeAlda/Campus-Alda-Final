<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Campus ALDA · Tu incorporación</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: reproductor de curso guiado — en inicio, una ruta vertical con nodos; en cada lección, la mascota Alda a la izquierda (fija) explica y señala, y el contenido avanza a la derecha por pasos con un dock inferior */
:root{
  --bg:#f5f4f2; --surface:#ffffff; --raise:#f8f7f6; --sand:#edebeb; --sand-2:#dfe3de; --line:#dedcd8;
  --ink:#111111; --muted:#5c5a58; --brand:#00403f; --brand-2:#002e2d; --brand-ink:#ffffff; --mint:#edebeb; --mint-2:#dedcd8;
  --spark:#000000; --spark-soft:#edebeb; --ok:#1d7a4b; --ok-soft:#dff2e7; --bad:#b3261e; --bad-soft:#fbe4e1;
  --hero:#00403f; --hero-2:#062f2e; --hero-ink:#ffffff; --logo-bg:#ffffff; --bubble:#ffffff; --bubble-ink:#0d1716;
  --display:'Poppins',system-ui,-apple-system,'Segoe UI',sans-serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:20px; --r-sm:14px; --shadow:0 1px 2px rgba(13,23,22,.06),0 10px 30px rgba(13,23,22,.07);
}


*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;margin:0}
h1,h2,h3,h4{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0;letter-spacing:-.01em}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--spark);outline-offset:2px;border-radius:8px}
img{max-width:100%;display:block}
.wrap{max-width:1200px;margin:0 auto;padding-inline:20px}
.eyebrow{font-family:var(--display);font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--brand)}
.muted{color:var(--muted)}
.note{font-size:13px;color:var(--muted)}
.lead{color:var(--muted);max-width:62ch}
.big{font-family:var(--display);font-size:clamp(21px,2.6vw,30px);font-weight:600;line-height:1.25;color:var(--brand);max-width:30ch;text-wrap:balance}

/* ---------- buttons ---------- */
.btn{border:0;border-radius:14px;padding:12px 20px;font-family:var(--display);font-weight:600;font-size:15px;background:var(--brand);color:var(--brand-ink);display:inline-flex;align-items:center;gap:8px;transition:transform .15s,background .15s}
.btn:hover{background:var(--brand-2)}
.btn:active{transform:scale(.97)}
.btn svg{width:18px;height:18px}
.btn.light{background:#ffffff;color:#00403f}
.btn.ghost{background:var(--sand);color:var(--ink)}
.btn.ghost:hover{background:var(--sand-2)}
.btn.line{background:transparent;color:#ffffff;border:1.5px solid rgba(255,255,255,.45)}
.btn.spark{background:var(--spark);color:#ffffff}
.btn[disabled]{opacity:.45;cursor:default}

/* ---------- top bar ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;border:0;background:none;padding:0}
.brand .lg{background:var(--logo-bg);border-radius:9px;padding:4px 8px}
.brand img{height:22px;width:auto}
.brand .lbl2{font-family:var(--display);font-weight:600;font-size:14px;color:var(--muted);border-left:1px solid var(--line);padding-left:10px}
.grow{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:6px 12px;font-size:13px;font-weight:700;background:var(--sand);white-space:nowrap;font-variant-numeric:tabular-nums}
.pill.pts{background:var(--spark-soft);color:var(--spark)}
.pill svg{width:16px;height:16px}
.minibar{width:110px;height:8px;border-radius:99px;background:var(--sand-2);overflow:hidden}
.minibar i{display:block;height:100%;background:var(--brand);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;width:38px;height:38px;display:grid;place-items:center;flex:none}
.icon-btn svg{width:18px;height:18px}
.icon-btn[aria-pressed="true"]{background:var(--mint);border-color:var(--brand);color:var(--brand)}

/* ---------- mascot ---------- */
.alda{position:relative;width:100%;aspect-ratio:560/512;max-width:100%}
.alda .fig{position:absolute;inset:0;animation:bob 3.2s ease-in-out infinite;transform-origin:50% 95%}
.alda img{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;user-select:none}
.alda .a-arm{transform-origin:61% 47.9%;transition:transform .5s cubic-bezier(.3,1.4,.5,1)}
.alda .a-patch{position:absolute;left:45.9%;top:40.2%;width:9.2%;height:6.6%;border-radius:50%;background:#1a1a19;box-shadow:0 0 3px 2px #1a1a19;opacity:0}
.alda .a-mouth{transform-origin:50.5% 40.8%;opacity:0}
.alda.talking .a-patch,.alda.talking .a-mouth{opacity:1}
.alda.talking .a-mouth{animation:talk .32s ease-in-out infinite alternate}
.alda.wave .a-arm{animation:wave 1.1s ease-in-out infinite}
.alda.point .a-arm{transform:rotate(28deg);animation:pointy 1.4s ease-in-out infinite}
.alda.cheer .fig{animation:cheer .7s cubic-bezier(.3,1.6,.5,1) 2}
.alda.cheer .a-arm{animation:wave .35s ease-in-out infinite}
.alda.oops .fig{animation:oops .6s ease-in-out}
.alda .shadow{position:absolute;left:18%;right:18%;bottom:-2%;height:5%;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.18),transparent);animation:shad 3.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5%)}}
@keyframes shad{0%,100%{transform:scaleX(1);opacity:1}50%{transform:scaleX(.88);opacity:.7}}
@keyframes talk{0%{transform:scaleY(.3)}60%{transform:scaleY(.95)}100%{transform:scaleY(.55)}}
@keyframes wave{0%,100%{transform:rotate(0)}50%{transform:rotate(13deg)}}
@keyframes pointy{0%,100%{transform:rotate(26deg)}50%{transform:rotate(31deg) translateX(1.5%)}}
@keyframes cheer{0%,100%{transform:translateY(0) scale(1)}40%{transform:translateY(-12%) scale(1.03,.97)}70%{transform:translateY(0) scale(1.04,.95)}}
@keyframes oops{0%,100%{transform:rotate(0)}25%{transform:rotate(-5deg)}50%{transform:rotate(4deg)}75%{transform:rotate(-2deg)}}

.bubble{position:relative;background:var(--bubble);color:var(--bubble-ink);border:1.5px solid var(--line);border-radius:20px;padding:14px 16px;font-size:15.5px;line-height:1.5;box-shadow:var(--shadow);min-height:3.2em}
.bubble b{color:var(--brand)}
.bubble .cur{display:inline-block;width:2px;height:1em;background:var(--brand);vertical-align:-2px;margin-left:2px;animation:blink .8s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.bubble.tail-down::after{content:"";position:absolute;left:38%;bottom:-11px;width:20px;height:20px;background:var(--bubble);border-right:1.5px solid var(--line);border-bottom:1.5px solid var(--line);transform:rotate(45deg);border-bottom-right-radius:4px}
.bubble.tail-left::after{content:"";position:absolute;left:-11px;top:22px;width:20px;height:20px;background:var(--bubble);border-left:1.5px solid var(--line);border-bottom:1.5px solid var(--line);transform:rotate(45deg);border-bottom-left-radius:4px}
.bubble.tail-up::after{content:"";position:absolute;left:30%;top:-11px;width:20px;height:20px;background:var(--bubble);border-left:1.5px solid var(--line);border-top:1.5px solid var(--line);transform:rotate(45deg);border-top-left-radius:4px}
body:not(.home-mode) footer.ft{display:none}
.say-tools{display:flex;gap:6px;margin-top:10px}
.say-tools button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 10px;font-size:12.5px;font-weight:600;display:inline-flex;gap:6px;align-items:center;color:var(--muted)}
.say-tools svg{width:15px;height:15px}

/* ---------- home ---------- */
.hero{margin-top:22px;background:radial-gradient(120% 140% at 85% 20%,var(--brand-2) 0%,var(--hero) 45%,var(--hero-2) 100%);color:var(--hero-ink);border-radius:30px;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);overflow:hidden;position:relative}
.hero .txt{padding:40px 38px 36px;display:grid;gap:16px;align-content:center;position:relative;z-index:1}
.hero .eyebrow{color:#edebeb}
.hero h1{font-size:clamp(30px,4.4vw,52px);font-weight:800;letter-spacing:-.02em}
.hero h1 em{font-style:normal;color:#ffffff}
.hero p{opacity:.9;max-width:46ch;font-size:17px}
.hero .ctas{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
.hero .stagebox{position:relative;display:grid;grid-template-rows:auto 1fr;align-items:end;padding:26px 26px 0 10px}
.hero .stagebox .bubble{margin-left:8%;max-width:330px;background:#ffffff;color:#0d1716;border-color:transparent}
.hero .stagebox .bubble b{color:#00403f}
.hero .stagebox .bubble.tail-down::after{background:#ffffff;border-color:transparent}
.hero .stagebox .say-tools button{background:#ffffff;color:#00403f;border-color:transparent}
.hero .stagebox .alda{width:min(330px,88%);margin:14px auto 0}
.hero .floor{position:absolute;left:0;right:0;bottom:0;height:22%;background:linear-gradient(transparent,rgba(0,0,0,.18))}
.summary{margin-top:16px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.sum{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;align-items:center;gap:12px;min-width:0}
.sum svg.ring{width:52px;height:52px;flex:none}
.sum b{font-family:var(--display);font-size:22px;line-height:1;display:block;font-variant-numeric:tabular-nums}
.sum small{color:var(--muted);font-size:12.5px}
.sum .si{width:40px;height:40px;border-radius:12px;background:var(--mint);color:var(--brand);display:grid;place-items:center;flex:none}
.sum .si svg{width:22px;height:22px}
.sh{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:40px 0 16px;flex-wrap:wrap}
.sh h2{font-size:26px;font-weight:700}
.sh p{color:var(--muted);font-size:14.5px}

/* route */
.route{position:relative;display:grid;gap:18px;padding-block:6px}
.route::before{content:"";position:absolute;left:50%;top:20px;bottom:20px;width:4px;margin-left:-2px;background:repeating-linear-gradient(var(--sand-2) 0 10px,transparent 10px 18px);border-radius:4px}
.route .fill{position:absolute;left:50%;top:20px;width:4px;margin-left:-2px;background:var(--brand);border-radius:4px;transition:height .8s}
.stop{display:grid;grid-template-columns:minmax(0,1fr) 64px minmax(0,1fr);align-items:center;position:relative}
.stop .node{grid-column:2;justify-self:center;width:56px;height:56px;border-radius:50%;background:var(--surface);border:3px solid var(--sand-2);display:grid;place-items:center;color:var(--muted);z-index:1;font-family:var(--display);font-weight:700;font-size:15px}
.stop .node svg{width:24px;height:24px}
.stop.done .node{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.stop.next .node{background:var(--spark);border-color:var(--spark);color:#ffffff;box-shadow:0 0 0 0 color-mix(in srgb,var(--spark) 50%,transparent);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 14px transparent}100%{box-shadow:0 0 0 0 transparent}}
.mcard{grid-row:1;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;text-align:left;display:grid;grid-template-columns:44px minmax(0,1fr);gap:4px 14px;align-items:center;transition:transform .2s,border-color .2s,box-shadow .2s;width:100%}
.mcard:hover{transform:translateY(-3px);border-color:var(--brand);box-shadow:var(--shadow)}
.stop:nth-child(odd of .stop) .mcard{grid-column:1}
.stop:nth-child(even of .stop) .mcard{grid-column:3}
.mcard .ic{width:44px;height:44px;border-radius:13px;background:var(--mint);color:var(--brand);display:grid;place-items:center;grid-row:span 2}
.mcard .ic svg{width:23px;height:23px}
.mcard h3{font-size:16.5px;font-weight:600}
.mcard p{font-size:13.5px;color:var(--muted);line-height:1.4}
.mcard .meta{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--muted);margin-top:8px;font-variant-numeric:tabular-nums}
.stop .mini{grid-row:1;width:92px;align-self:end}
.stop:nth-child(odd of .stop) .mini{grid-column:3;justify-self:start;margin-left:6px}
.stop:nth-child(even of .stop) .mini{grid-column:1;justify-self:end;margin-right:6px}
.tag{font-size:11.5px;font-weight:700;border-radius:99px;padding:3px 10px;background:var(--sand)}
.tag.done{background:var(--ok-soft);color:var(--ok)}
.tag.next{background:var(--spark-soft);color:var(--spark)}
.tag.new{background:var(--mint);color:var(--brand)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:12px}
.badge{text-align:center;font-size:12px;color:var(--muted);display:grid;gap:6px;justify-items:center}
.badge .b{width:62px;height:62px;border-radius:20px;display:grid;place-items:center;background:var(--sand);color:var(--muted);border:2px dashed var(--line);transform:rotate(45deg)}
.badge .b svg{width:26px;height:26px;transform:rotate(-45deg)}
.badge.on .b{background:var(--spark-soft);color:var(--spark);border:2px solid var(--spark)}
.badge.on{color:var(--ink);font-weight:600}
.panelcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px}

/* ---------- player (lesson) ---------- */
.player{display:grid;grid-template-columns:270px minmax(0,1fr);gap:28px;padding-block:24px 130px;align-items:start}
.guide{position:sticky;top:calc(84px + env(safe-area-inset-top,0px));display:grid;gap:4px}
.guide .alda{width:100%}
.guide .back{justify-self:start;margin-bottom:8px}
.slide{display:grid;gap:18px;min-width:0}
.shead{display:grid;gap:8px}
.shead .top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.shead h1{font-size:clamp(26px,3.4vw,38px);font-weight:700}
.shead .stitle{font-family:var(--display);font-weight:600;color:var(--muted);font-size:16px}
.enter{animation:enter .45s cubic-bezier(.2,.8,.2,1)}
@keyframes enter{from{opacity:.0;transform:translateY(14px)}to{opacity:1;transform:none}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:24px;min-width:0}
.card h3{font-size:19px;font-weight:600;margin-bottom:12px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr))}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:25;padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line)}
.dock .wrap{display:flex;align-items:center;gap:12px}
.dots{flex:1;display:flex;gap:6px;justify-content:center;align-items:center}
.dots button{border:0;padding:0;height:10px;width:28px;border-radius:99px;background:var(--sand-2);transition:width .3s,background .3s}
.dots button.on{width:52px;background:var(--brand)}
.dots button.seen{background:color-mix(in srgb,var(--brand) 40%,var(--sand-2))}
.dock .count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}

/* stats */
.stat{background:var(--raise);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:6px;align-content:start}
.stat b{font-family:var(--display);font-size:30px;font-weight:700;color:var(--brand);line-height:1.05;font-variant-numeric:tabular-nums}
.stat span{font-size:14px;color:var(--muted);line-height:1.45}
.stat .si{width:34px;height:34px;color:var(--brand)}

/* questions */
.q{display:grid;gap:12px}
.q .qt{font-family:var(--display);font-weight:600;font-size:17px;line-height:1.35}
.q .k{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--spark);font-weight:700}
.opts{display:grid;gap:10px}
.opt{border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:13px 15px;text-align:left;font-size:15px;display:flex;gap:12px;align-items:center;transition:border-color .15s,background .15s,transform .15s}
.opt .l{flex:none;width:28px;height:28px;border-radius:9px;background:var(--sand);display:grid;place-items:center;font-size:13px;font-weight:700;font-family:var(--display);text-transform:uppercase}
.opt:hover:not([disabled]){border-color:var(--brand);transform:translateX(3px)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .l{background:var(--ok);color:#ffffff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);animation:shake .4s}
.opt.wrong .l{background:var(--bad);color:#ffffff}
.opt[disabled]{cursor:default}
@keyframes shake{25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
.fb{font-size:14.5px;border-radius:var(--r-sm);padding:11px 14px;font-weight:500}
.fb.ok{background:var(--ok-soft);color:var(--ok)}
.fb.ko{background:var(--bad-soft);color:var(--bad)}
.qcard{border-left:5px solid var(--brand)}
.qcard.solved{border-left-color:var(--ok)}

/* drag & drop matching */
.dnd{display:grid;gap:14px}
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:48px;padding:12px;border-radius:var(--r-sm);background:var(--raise);border:1.5px dashed var(--line)}
.pool:empty::after{content:"¡Todo colocado!";color:var(--ok);font-weight:700;font-size:14px;align-self:center}
.chipd{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 13px;font-size:14px;font-weight:600;display:inline-flex;gap:8px;align-items:center;cursor:grab;touch-action:manipulation;transition:transform .15s,box-shadow .15s,border-color .15s}
.chipd svg{width:16px;height:16px;color:var(--muted)}
.chipd:hover{border-color:var(--brand)}
.chipd.sel{border-color:var(--spark);box-shadow:0 0 0 3px var(--spark-soft);transform:translateY(-2px)}
.chipd.placed{cursor:default;background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:10px}
.bin{border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:12px;min-height:110px;display:flex;flex-direction:column;gap:8px;text-align:left;transition:border-color .15s,background .15s}
.bin .bh{font-family:var(--display);font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px}
.bin .bh i{width:10px;height:10px;border-radius:50%;background:var(--c,var(--brand));flex:none}
.bin.ready{border-color:var(--spark);background:color-mix(in srgb,var(--spark-soft) 50%,var(--surface))}
.bin.over{border-color:var(--brand);background:var(--mint)}
.bin.no{animation:shake .4s;border-color:var(--bad)}
.bin .items{display:flex;flex-wrap:wrap;gap:6px}

/* company explorer */
.explorer{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:16px}
.ctabs{display:grid;gap:8px;align-content:start}
.ctab{border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:10px 12px;display:flex;gap:10px;align-items:center;text-align:left;font-weight:600;font-size:14.5px;transition:border-color .2s,background .2s}
.ctab i{width:12px;height:12px;border-radius:50%;background:var(--c);flex:none}
.ctab[aria-selected="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,var(--surface))}
.cpanel{border-radius:var(--r);padding:26px;color:#ffffff;background:var(--c);display:grid;gap:12px;align-content:start;min-height:280px;position:relative;overflow:hidden;transition:background .35s}
.cpanel .lgbox{background:#ffffff;width:max-content}
.cpanel h3{font-size:26px;color:#ffffff;margin:0}
.cpanel .sub{opacity:.85;font-weight:600}
.cpanel em{opacity:.9;font-family:var(--display);font-style:normal;font-weight:600;font-size:18px}
.cpanel .wm{position:absolute;right:-30px;bottom:-40px;font-family:var(--display);font-weight:800;font-size:180px;line-height:1;opacity:.1;pointer-events:none}
.lgbox{background:var(--logo-bg);border-radius:12px;padding:8px 12px;height:56px;display:flex;align-items:center}
.lgbox img{max-height:38px;width:auto}
.values{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.value{border:1.5px solid var(--mint-2);background:var(--mint);color:var(--brand);border-radius:99px;padding:7px 14px;font-size:14px;font-weight:700;font-family:var(--display);display:inline-flex;gap:6px;align-items:center;transition:transform .2s,background .2s}
.value svg{width:16px;height:16px}
.value:hover{transform:translateY(-2px) rotate(-2deg);background:var(--mint-2)}

/* timeline scrubber */
.scrub{display:grid;gap:16px}
.scrub .yr{font-family:var(--display);font-weight:800;font-size:clamp(46px,8vw,84px);line-height:1;color:var(--brand);font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.scrub .ev{font-family:var(--display);font-size:20px;font-weight:600}
.scrub input[type=range]{width:100%;accent-color:var(--brand)}
.ticks{display:flex;justify-content:space-between;gap:4px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.ticks button{border:0;background:none;padding:2px 0;font-size:12px;color:var(--muted);font-weight:600}
.ticks button.on{color:var(--brand)}
.carousel{display:grid;grid-auto-flow:column;grid-auto-columns:min(78%,320px);gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:8px}
.carousel figure{margin:0;scroll-snap-align:start;border-radius:var(--r-sm);overflow:hidden;background:var(--logo-bg);border:1px solid var(--line);display:grid;grid-template-rows:auto auto}
.carousel figure .imgbox{aspect-ratio:16/10;display:grid;place-items:center;background:var(--logo-bg)}
.carousel img{width:100%;height:100%;object-fit:contain}
.carousel figure.cover img{object-fit:cover}
.carousel figcaption{padding:10px 12px;font-weight:600;font-size:14px;background:var(--surface);color:var(--ink)}

/* people */
.needs{display:flex;flex-wrap:wrap;gap:8px}
.need{border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 13px;font-size:14px;font-weight:600}
.need[aria-pressed="true"]{background:var(--spark);border-color:var(--spark);color:#ffffff}
.org{display:grid;gap:18px}
.tier .unit{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:8px}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,180px),1fr));gap:10px}
.person{border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:14px;text-align:left;display:grid;grid-template-columns:46px minmax(0,1fr);gap:4px 12px;align-items:center;transition:opacity .25s,border-color .25s,transform .25s}
.person .av{grid-row:span 2;width:46px;height:46px;border-radius:15px;display:grid;place-items:center;font-weight:700;font-family:var(--display);color:#ffffff;background:var(--c,#00403f)}
.person b{font-size:14.5px;line-height:1.2}
.person small{color:var(--muted);font-size:12.5px;line-height:1.3}
.person .more{grid-column:1/-1;font-size:13.5px;border-top:1px solid var(--line);padding-top:8px;margin-top:6px}
.person[aria-expanded="true"]{border-color:var(--brand);background:var(--mint)}
.org.filtering .person{opacity:.35}
.org.filtering .person.hit{opacity:1;border-color:var(--spark);transform:scale(1.03);box-shadow:0 0 0 3px var(--spark-soft)}

/* day simulator */
.day{display:grid;gap:16px}
.clock{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.clock b{font-family:var(--display);font-size:clamp(44px,7vw,72px);font-weight:800;color:var(--brand);line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.clock .ph{font-family:var(--display);font-weight:600;font-size:18px}
.dayband{position:relative;height:44px;border-radius:12px;overflow:hidden;display:flex;border:1px solid var(--line)}
.dayband span{display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden}
.dayband .marker{position:absolute;top:0;bottom:0;width:3px;background:var(--spark);transition:left .2s}
.day input[type=range]{width:100%;accent-color:var(--spark)}
.daycard{background:var(--raise);border:1px solid var(--line);border-radius:var(--r-sm);padding:16px;display:flex;gap:14px;align-items:flex-start}
.daycard svg{width:28px;height:28px;color:var(--brand);flex:none}
.apps{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,120px),1fr));gap:10px}
.app{border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r);padding:16px 10px;display:grid;justify-items:center;gap:8px;font-weight:600;font-size:13.5px;text-align:center;transition:transform .2s,border-color .2s}
.app .ai{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;color:#ffffff;background:var(--c)}
.app .ai svg{width:26px;height:26px}
.app:hover{transform:translateY(-3px)}
.app[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 10%,var(--surface))}
.appinfo{border-radius:var(--r-sm);padding:16px 18px;background:var(--mint);display:flex;gap:12px;align-items:center}

/* flip faq */
.flipgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:12px}
.flip{perspective:1100px;border:0;background:none;padding:0;min-height:180px;text-align:left}
.flip .in{position:relative;width:100%;height:100%;min-height:180px;transition:transform .6s cubic-bezier(.3,1.3,.5,1);transform-style:preserve-3d}
.flip[aria-pressed="true"] .in{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;border-radius:var(--r);padding:18px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;gap:8px}
.flip .f{background:var(--brand);color:var(--brand-ink);justify-content:space-between}
.flip .f strong{font-family:var(--display);font-size:17px;line-height:1.3}
.flip .f small{opacity:.8;font-size:12.5px;display:flex;gap:6px;align-items:center}
.flip .f small svg{width:14px;height:14px}
.flip .b{background:var(--surface);color:var(--ink);border:2px solid var(--brand);transform:rotateY(180deg);font-size:14.5px;justify-content:center}
.flip .b em{color:var(--muted);font-size:13px}
.progressline{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--muted);font-weight:600}
.progressline .meter{flex:1}

/* chat scenario */
.chat{display:grid;gap:10px;background:var(--raise);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-height:300px;align-content:start}
.cmsg{display:flex;gap:10px;align-items:flex-end;max-width:88%}
.cmsg .ava{width:38px;height:38px;flex:none;border-radius:50%;background:var(--mint);overflow:hidden;position:relative}
.cmsg .ava img{position:absolute;width:150%;max-width:none;left:-24%;top:-12%}
.cmsg p{background:var(--surface);border:1px solid var(--line);border-radius:16px 16px 16px 4px;padding:10px 13px;font-size:15px}
.cmsg.me{justify-self:end;flex-direction:row-reverse}
.cmsg.me p{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);border-radius:16px 16px 4px 16px}
.cmsg.fbok p{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.cmsg.fbko p{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.replies{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.reply{border:1.5px solid var(--brand);background:var(--surface);color:var(--brand);border-radius:16px 16px 4px 16px;padding:9px 14px;font-size:14.5px;font-weight:600;text-align:left;max-width:100%}
.reply:hover{background:var(--mint)}
.typing{display:inline-flex;gap:4px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:16px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:dot 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,100%{opacity:.3;transform:none}50%{opacity:1;transform:translateY(-3px)}}

/* commitments meter */
.commit{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.commit div{display:grid;gap:6px;font-size:11.5px;color:var(--muted);font-weight:600;line-height:1.25}
.commit div i{height:8px;border-radius:99px;background:var(--sand-2);display:block}
.commit div.on i{background:var(--ok)}
.commit div.on{color:var(--ink)}

/* cyber */
.rtabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.rtab{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 13px;display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:14px;white-space:nowrap}
.rtab svg{width:18px;height:18px;color:var(--brand)}
.rtab[aria-selected="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.rtab[aria-selected="true"] svg{color:var(--brand-ink)}
.rtab .ck{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.rbody{background:var(--raise);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:start}
.rbody .ri{width:56px;height:56px;border-radius:16px;background:var(--mint);color:var(--brand);display:grid;place-items:center}
.rbody .ri svg{width:28px;height:28px}
.rbody ul{margin:8px 0 0;padding:0;list-style:none;display:grid;gap:8px}
.rbody li{display:flex;gap:10px;align-items:flex-start;font-size:15px}
.rbody li svg{width:18px;height:18px;color:var(--ok);flex:none;margin-top:3px}
.inbox{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface);min-height:360px}
.ilist{border-right:1px solid var(--line);display:grid;align-content:start;background:var(--raise)}
.irow{border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;padding:12px 14px;display:grid;gap:2px;font-size:13px}
.irow b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.irow span{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.irow[aria-selected="true"]{background:var(--surface);box-shadow:inset 4px 0 0 var(--brand)}
.irow .st{font-size:11.5px;font-weight:700}
.irow .st.ok{color:var(--ok)}.irow .st.ko{color:var(--bad)}
.iview{padding:18px;display:grid;gap:14px;align-content:start;min-width:0}
.iview .from{font-size:13.5px;color:var(--muted);word-break:break-all}
.iview h4{font-size:19px}
.iview .fake{display:inline-block;background:#0b5cad;color:#ffffff;border-radius:8px;padding:9px 16px;font-weight:600;font-size:14px;width:max-content}
.verdict{display:flex;gap:10px;flex-wrap:wrap}
.flags{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.flags li{display:flex;gap:10px;align-items:flex-start;font-size:14.5px;background:var(--raise);border-radius:12px;padding:10px 12px}
.flags li svg{width:18px;height:18px;flex:none;margin-top:2px;color:var(--spark)}
.score-pill{font-family:var(--display);font-weight:700;color:var(--brand)}
.pwlab{display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;align-items:center}
.lockico{width:92px;height:92px;border-radius:28px;display:grid;place-items:center;background:var(--sand);color:var(--muted);transition:background .3s,color .3s}
.lockico svg{width:46px;height:46px}
.lockico.s1{background:var(--bad-soft);color:var(--bad)}.lockico.s2{background:var(--spark-soft);color:var(--spark)}.lockico.s3{background:var(--ok-soft);color:var(--ok)}
.pw{font:inherit;font-size:16px;width:100%;border:1.5px solid var(--line);border-radius:var(--r-sm);padding:12px 14px;background:var(--surface);color:var(--ink)}
.meter{height:10px;border-radius:99px;background:var(--sand-2);overflow:hidden}
.meter i{display:block;height:100%;width:0;border-radius:99px;transition:width .35s,background .35s;background:var(--brand)}
.pwchecks{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:6px}
.pwchecks li{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted)}
.pwchecks li i{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);flex:none}
.pwchecks li.on{color:var(--ink)}
.pwchecks li.on i{background:var(--ok);border-color:var(--ok)}
.alert{border-left:5px solid var(--spark);background:var(--spark-soft);border-radius:var(--r-sm);padding:16px 18px;font-size:15px}

/* growth */
.journey{list-style:none;margin:0;padding:0;display:grid;gap:0}
.journey li{display:grid;grid-template-columns:40px minmax(0,1fr);gap:14px;position:relative;padding-bottom:18px}
.journey li::before{content:"";position:absolute;left:19px;top:34px;bottom:0;width:2px;background:var(--line)}
.journey li:last-child::before{display:none}
.journey .dotj{width:40px;height:40px;border-radius:50%;background:var(--mint);color:var(--brand);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:14px;z-index:1}
.journey b{font-family:var(--display);display:block}
.ladder{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));align-items:end;gap:8px;height:220px}
.ladder div{background:var(--mint);border-radius:14px 14px 4px 4px;display:flex;align-items:flex-end;padding:10px;font-family:var(--display);font-weight:600;font-size:13.5px;line-height:1.2;color:var(--brand);transform-origin:bottom;animation:grow .8s cubic-bezier(.2,.8,.2,1) both}
.ladder div:nth-child(1){height:30%}.ladder div:nth-child(2){height:52%;animation-delay:.1s}.ladder div:nth-child(3){height:74%;animation-delay:.2s}
.ladder div:nth-child(4){height:100%;background:var(--brand);color:var(--brand-ink);animation-delay:.3s}
@keyframes grow{from{transform:scaleY(.15)}to{transform:none}}
textarea.ta{font:inherit;width:100%;border:1.5px solid var(--line);border-radius:var(--r-sm);padding:11px 13px;background:var(--surface);color:var(--ink);resize:vertical}
label.lb{font-weight:600;font-size:14.5px}

/* final + cert */
.fq-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.fqbar{height:8px;border-radius:99px;background:var(--sand-2);overflow:hidden}
.fqbar i{display:block;height:100%;background:var(--spark);transition:width .4s}
.cert{border-radius:26px;padding:34px 28px;text-align:center;display:grid;gap:10px;justify-items:center;background:radial-gradient(120% 120% at 50% 0%,var(--brand-2),var(--hero) 60%,var(--hero-2));color:#ffffff;position:relative;overflow:hidden}
.cert .alda{width:170px}
.cert .lgw{background:#ffffff;padding:6px 10px;border-radius:9px}
.cert .lgw img{height:26px;width:auto}
.cert .eyebrow{color:#edebeb}
.cert .t{font-family:var(--display);font-size:clamp(26px,4vw,36px);font-weight:800}
.cert .score{font-family:var(--display);font-size:54px;font-weight:800;color:#ffffff;line-height:1;font-variant-numeric:tabular-nums}
.confetti{position:absolute;inset:0;pointer-events:none}
.confetti i{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:fall 2.6s linear forwards}
#stage{position:relative}
@keyframes fall{to{transform:translateY(560px) rotate(540deg);opacity:0}}
.check{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.check label{display:flex;gap:12px;align-items:center;padding:11px 12px;border-radius:12px;cursor:pointer;font-size:15px;border:1.5px solid var(--line);background:var(--surface);transition:background .2s,border-color .2s}
.check label:has(input:checked){background:var(--ok-soft);border-color:var(--ok)}
.check input{accent-color:var(--ok);width:20px;height:20px;flex:none}

/* AI assistant */
.fab{position:fixed;right:20px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:30;border:0;border-radius:99px;background:var(--brand);color:var(--brand-ink);padding:6px 18px 6px 6px;font-family:var(--display);font-weight:600;display:flex;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(0,64,63,.35)}
.home-mode .fab{bottom:calc(20px + env(safe-area-inset-bottom,0px))}
.fab .fav{width:44px;height:44px;border-radius:50%;background:#ffffff;position:relative;overflow:hidden}
.fab .fav img{position:absolute;width:170%;max-width:none;left:-32%;top:-14%}
.panel{position:fixed;right:20px;bottom:calc(150px + env(safe-area-inset-bottom,0px));z-index:31;width:min(400px,calc(100vw - 32px));height:min(540px,calc(100vh - 200px));background:var(--surface);border:1px solid var(--line);border-radius:24px;box-shadow:0 20px 50px rgba(0,0,0,.2);display:flex;flex-direction:column;overflow:hidden}
.home-mode .panel{bottom:calc(86px + env(safe-area-inset-bottom,0px))}
.panel header{background:var(--brand);color:var(--brand-ink);padding:12px 14px;display:flex;align-items:center;gap:10px}
.panel header .fav{width:40px;height:40px;border-radius:50%;background:#ffffff;position:relative;overflow:hidden;flex:none}
.panel header .fav img{position:absolute;width:170%;max-width:none;left:-32%;top:-14%}
.panel header b{display:block;font-family:var(--display);font-size:15px}
.panel header small{opacity:.85;font-size:12px}
.panel header button{margin-left:auto;border:0;background:rgba(255,255,255,.18);color:inherit;border-radius:10px;width:34px;height:34px}
.msgs{flex:1;overflow:auto;padding:14px;display:grid;gap:10px;align-content:start}
.msg{max-width:88%;padding:10px 13px;border-radius:14px;font-size:14.5px;white-space:pre-wrap}
.msg.me{justify-self:end;background:var(--brand);color:var(--brand-ink);border-bottom-right-radius:4px}
.msg.ai{justify-self:start;background:var(--sand);border-bottom-left-radius:4px}
.msg.ai small{display:block;color:var(--muted);font-size:11px;margin-top:6px}
.sugs{display:flex;gap:6px;flex-wrap:wrap;padding:0 14px 10px}
.sugs button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 10px;font-size:12.5px}
.compose{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
.compose input{flex:1;min-width:0;font:inherit;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface);color:var(--ink)}
.ai-tip{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ai-out{background:var(--mint);border-radius:var(--r-sm);padding:14px 16px;font-size:14.5px;white-space:pre-wrap;flex-basis:100%}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(70px + env(safe-area-inset-top,0px));z-index:40;background:var(--ink);color:var(--bg);border-radius:99px;padding:10px 18px;font-weight:700;font-size:14px;display:flex;gap:8px;align-items:center;animation:pop .35s cubic-bezier(.3,1.5,.5,1)}
@keyframes pop{from{transform:translateX(-50%) scale(.7);opacity:0}}
.toast svg{width:18px;height:18px;color:var(--spark)}
footer.ft{color:var(--muted);font-size:12.5px;text-align:center;padding-block:30px 40px}

@media (max-width:900px){
  .player{grid-template-columns:minmax(0,1fr);gap:14px}
  .guide{position:sticky;top:calc(58px + env(safe-area-inset-top,0px));z-index:5;grid-template-columns:84px minmax(0,1fr);align-items:center;gap:10px;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(8px);padding:8px 0}
  .guide .back{display:none}
  .guide .bubble{font-size:14.5px;padding:10px 12px}
  .guide .bubble.tail-down::after{left:-9px;top:18px;bottom:auto;transform:rotate(135deg)}
  .guide .say-tools{display:none}
  .guide .bubble.tail-up::after{left:-10px;top:18px;transform:rotate(-45deg)}
  .explorer{grid-template-columns:minmax(0,1fr)}
  .ctabs{grid-template-columns:repeat(2,minmax(0,1fr))}
  .inbox{grid-template-columns:minmax(0,1fr)}
  .ilist{border-right:0;border-bottom:1px solid var(--line);grid-auto-flow:column;grid-auto-columns:minmax(200px,1fr);overflow-x:auto}
  .summary{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:820px){
  .hero{grid-template-columns:minmax(0,1fr)}
  .hero .txt{padding:26px 22px 4px}
  .hero .stagebox{padding:10px 18px 0}
  .hero .stagebox .alda{width:min(240px,70%)}
  .minibar{display:none}
  .brand .lbl2{display:none}
  .fab span.t{display:none}
  .fab{padding:5px}
  .route::before,.route .fill{left:30px}
  .stop{grid-template-columns:64px minmax(0,1fr)}
  .stop .node{grid-column:1}
  .stop:nth-child(n of .stop) .mcard{grid-column:2}
  .stop .mini{display:none}
  .commit{grid-template-columns:repeat(3,minmax(0,1fr))}
  .pwlab{grid-template-columns:minmax(0,1fr)}
  .rbody{grid-template-columns:minmax(0,1fr)}
  .dock .count{display:none}
  .dots button{width:18px}.dots button.on{width:34px}
}
.q-inline .card{border:0;padding:0;background:none}
@media (max-width:820px){.hide-s{display:none}}

#app:focus,#app:focus-visible{outline:none}
.socgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,185px),1fr));gap:12px}
.soc{border:1.5px solid var(--line);border-radius:var(--r-sm);padding:16px;display:grid;gap:10px;align-content:start;background:var(--surface)}
.soc .lgbox{height:56px;justify-content:flex-start}.soc .lgbox img{max-height:48px;width:auto}
.socl{display:flex;flex-wrap:wrap;gap:6px}
.socl a,.socl .off{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600;text-decoration:none}
.socl a{background:var(--brand);color:var(--brand-ink)}.socl a:hover{background:var(--brand-2)}
.socl .off{background:var(--sand);color:var(--muted)}
.socl svg{width:15px;height:15px}
.socok{display:flex;gap:10px;align-items:center;font-weight:600;padding:12px;border:1.5px dashed var(--line);border-radius:12px;cursor:pointer}
.socok input{width:20px;height:20px;accent-color:var(--brand)}
.eyebrow svg{width:14px;height:14px;vertical-align:-2px}
.phx{margin:0;border-radius:var(--r);overflow:hidden;background:var(--sand);width:100%}
.phx img{width:100%;height:100%;object-fit:cover;display:block}
.stagebox.heroimg{padding:0!important;display:block}
.heroimg img{width:100%;height:100%;min-height:360px;object-fit:cover;display:block}
@media (max-width:820px){.heroimg img{min-height:220px;max-height:280px}}
.pho{margin:0;position:relative;border-radius:var(--r);overflow:hidden;aspect-ratio:21/8}
.pho img{width:100%;height:100%;object-fit:cover;display:block;transform:scale(1.02);animation:kb 14s ease-in-out infinite alternate}
@keyframes kb{to{transform:scale(1.09)}}
@keyframes popin{from{opacity:0;transform:translateY(8px) scale(.96)}}
.pho::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,43,42,.9),rgba(0,64,63,.45) 50%,transparent 80%)}
.pho figcaption{position:absolute;left:28px;bottom:24px;right:45%;z-index:1;color:#fff;display:grid;gap:6px}
.pho figcaption b{font-family:var(--display);font-size:clamp(20px,2.6vw,30px);line-height:1.15}
.pho figcaption span{opacity:.9;font-size:15px}
.php{margin:0;background:#fff;padding:10px 10px 30px;border-radius:6px;box-shadow:0 16px 30px -12px rgba(0,0,0,.35);transform:rotate(2.5deg);transition:transform .4s}
.php:hover{transform:rotate(0) scale(1.02)}
.php img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;border-radius:3px}
.pha{margin:0 auto;border-radius:200px 200px 24px 24px;overflow:hidden;aspect-ratio:4/5;max-height:360px;width:100%;max-width:300px}
.pha img{width:100%;height:100%;object-fit:cover;display:block}
.wmcard{position:relative;overflow:hidden}
.wmcard::after{content:'';position:absolute;left:24px;bottom:-26px;width:340px;height:120px;background:var(--wm) no-repeat left center/contain;opacity:.06;pointer-events:none}
.wmcard>*{position:relative;z-index:1}
.whoami{background:radial-gradient(120% 140% at 90% 0%,#0b5553,#00403f 55%,#002a29);color:#fff;border:0;position:relative;overflow:hidden}
.whoami .big{color:#fff}.whoami .eyebrow{color:#edebeb}
.whoami::after{content:'';position:absolute;right:-30px;bottom:-30px;width:480px;height:170px;background:var(--wm) no-repeat center/contain;filter:invert(1);mix-blend-mode:screen;opacity:.12;pointer-events:none}
.whoami .value{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.28);color:#fff;animation:popin .5s both}
.whoami .value:nth-child(2){animation-delay:.05s}.whoami .value:nth-child(3){animation-delay:.1s}.whoami .value:nth-child(4){animation-delay:.15s}.whoami .value:nth-child(5){animation-delay:.2s}.whoami .value:nth-child(6){animation-delay:.25s}.whoami .value:nth-child(7){animation-delay:.3s}.whoami .value:nth-child(8){animation-delay:.35s}.whoami .value:nth-child(9){animation-delay:.4s}
.whoami .value:hover{background:rgba(255,255,255,.2)}
.tl2{display:grid;gap:18px;overflow:hidden}
.tlhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tlhead .btn svg{width:16px;height:16px}
.tlstage{position:relative;min-height:170px;display:flex;align-items:center}
.tlbig{position:absolute;right:-6px;top:50%;transform:translateY(-50%);font-family:var(--display);font-weight:800;font-size:clamp(70px,13vw,150px);line-height:1;color:var(--c,#00403f);opacity:.08;white-space:nowrap;pointer-events:none;transition:color .4s}
.tlcard{position:relative;max-width:520px;border-left:6px solid var(--c,#00403f);padding:6px 0 6px 20px;display:grid;gap:8px}
.tlcard.enter{animation:tlin .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes tlin{from{opacity:0;transform:translateX(24px)}}
.tlcard .ent{justify-self:start;font-size:12px;font-weight:700;color:#fff;background:var(--c);border-radius:99px;padding:3px 10px}
.tlcard .yr{font-family:var(--display);font-weight:800;font-size:clamp(30px,4vw,44px);line-height:1;color:var(--c)}
.tlcard h4{margin:0;font-family:var(--display);font-size:20px}
.tlcard p{margin:0;color:var(--muted)}
.tltrack{position:relative;display:grid;grid-template-columns:repeat(6,minmax(96px,1fr));gap:6px;overflow-x:auto;padding:6px 2px 4px}
.tlline{position:absolute;left:8%;right:8%;top:16px;height:4px;border-radius:4px;background:var(--sand)}
.tlline i{display:block;height:100%;width:0;border-radius:4px;background:linear-gradient(90deg,#0064A4,#06704c,#00403f,#000);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.tlnode{position:relative;border:0;background:none;display:grid;justify-items:center;gap:4px;text-align:center;cursor:pointer;padding:0 4px;color:var(--ink)}
.tlnode .dot{width:24px;height:24px;border-radius:50%;background:#fff;border:4px solid var(--c);transition:transform .3s,background .3s}
.tlnode b{font-family:var(--display);font-size:14px}
.tlnode small{font-size:11.5px;color:var(--muted);line-height:1.25}
.tlnode.on .dot{background:var(--c);transform:scale(1.25);box-shadow:0 0 0 6px color-mix(in srgb,var(--c) 18%,transparent)}
.tlnode:hover .dot{transform:scale(1.15)}
.stat{min-width:0}.stat b{font-size:clamp(18px,1.9vw,28px)!important;line-height:1.1;overflow-wrap:anywhere}
.pjf{display:flex;flex-wrap:wrap;gap:8px}
.pjf button{border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 14px;font-weight:600;font-size:13.5px;display:inline-flex;gap:8px;align-items:center;cursor:pointer}
.pjf button i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.pjf button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.pjgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr));gap:12px}
.pj{border:1.5px solid var(--line);border-radius:var(--r-sm);background:var(--surface);padding:14px;display:grid;gap:10px;align-content:start;position:relative;overflow:hidden;border-top:4px solid var(--c);transition:transform .3s,box-shadow .3s;animation:popin .4s both}
.pj:hover{transform:translateY(-4px);box-shadow:0 14px 26px -16px rgba(0,0,0,.4)}
.pj[hidden]{display:none}
.pjlogo{height:64px;display:flex;align-items:center;justify-content:flex-start}
.pjlogo img{max-height:56px;max-width:150px;width:auto;object-fit:contain}
.pjico{width:52px;height:52px;border-radius:14px;background:color-mix(in srgb,var(--c) 12%,transparent);color:var(--c);display:grid;place-items:center}
.pjico svg{width:26px;height:26px}
.pjfilm{height:64px;border-radius:10px;background:#000;color:#fff;display:flex;align-items:center;gap:10px;padding:0 14px}
.pjfilm svg{width:20px;height:20px;opacity:.7;flex:none}
.pjfilm b{font-family:var(--display);letter-spacing:.22em;font-size:17px}
.pjtx{display:grid;gap:4px}.pjtx b{font-family:var(--display);font-size:15px;line-height:1.25}.pjtx span{font-size:13.5px;color:var(--muted);line-height:1.4}
.pjtag{font-size:11px;font-weight:700;color:var(--c);text-transform:uppercase;letter-spacing:.05em}
.c3d{perspective:1000px}
.t3d{transform-style:preserve-3d;transition:transform .25s ease-out;transform:rotateX(5deg) rotateY(-5deg);animation:flt 6s ease-in-out infinite}
.t3d:nth-child(2){animation-delay:-2s}.t3d:nth-child(3){animation-delay:-4s}
@keyframes flt{50%{translate:0 -6px}}
.t3in{position:relative;border-radius:22px;padding:24px 26px;min-height:200px;display:grid;gap:8px;align-content:end;transform-style:preserve-3d;box-shadow:0 26px 40px -18px rgba(0,30,29,.6),inset 0 1px 0 rgba(255,255,255,.18)}
.t3a .t3in{background:linear-gradient(150deg,#0b5553,#00403f 60%,#002a29);color:#fff}
.t3b .t3in{background:linear-gradient(150deg,#2a2a2a,#000);color:#fff}
.t3c .t3in{background:linear-gradient(150deg,#ffffff,#edebeb);color:#111;border:1px solid var(--line)}
.t3i{position:absolute;top:22px;left:22px;width:54px;height:54px;border-radius:16px;background:rgba(255,255,255,.14);display:grid;place-items:center;transform:translateZ(50px);box-shadow:0 10px 20px -8px rgba(0,0,0,.5)}
.t3i svg{width:28px;height:28px}
.t3in b{font-family:var(--display);font-size:clamp(20px,2.2vw,26px);line-height:1.1;transform:translateZ(24px)}
.t3in span{font-size:14px;opacity:.88;transform:translateZ(14px)}
.t3m{position:absolute;right:8px;top:-44px;width:110px;transform:translateZ(70px);filter:drop-shadow(0 14px 14px rgba(0,0,0,.3))}
@media (max-width:820px){.pho{aspect-ratio:4/3}.pho figcaption{right:20px;left:20px}.t3d{transform:none}.t3in{min-height:170px}.tlstage{min-height:200px}}
.dirmsg{display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px;align-items:start}
.dirph{display:flex;padding-left:14px}
.dirph img{width:104px;height:104px;border-radius:50%;object-fit:cover;border:4px solid var(--surface);box-shadow:0 8px 22px rgba(0,0,0,.14);margin-left:-14px;background:var(--sand)}
.dirmsg .lead{margin:0 0 12px}
.dirmsg .more[hidden]{display:none}
.sign{font-size:14px;color:var(--muted);margin-top:6px}
.linkbtn{border:0;background:none;color:var(--brand);font:inherit;font-weight:700;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.climb{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));align-items:end;gap:10px;height:280px;position:relative;padding-top:56px}
.climb button{border:0;border-radius:16px 16px 6px 6px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6px;padding:10px 6px;font-family:var(--display);font-weight:700;font-size:12.5px;line-height:1.2;text-align:center;cursor:pointer;transition:filter .3s,transform .3s,box-shadow .3s;transform-origin:bottom;filter:saturate(.35) opacity(.6);animation:grow .8s cubic-bezier(.2,.8,.2,1) both}
.climb button svg{width:22px;height:22px;flex:none}
.climb button:hover{transform:translateY(-4px)}
.climb button:nth-child(1){height:34%;background:#c9d8d6;color:#00403f}
.climb button:nth-child(2){height:55%;background:#7fa5a2;color:#fff;animation-delay:.1s}
.climb button:nth-child(3){height:77%;background:#2f6866;color:#fff;animation-delay:.2s}
.climb button:nth-child(4){height:100%;background:#00403f;color:#fff;animation-delay:.3s}
.climb button.on{filter:none;box-shadow:0 12px 24px -10px rgba(0,64,63,.6)}
.climbme{position:absolute;width:52px;height:52px;border-radius:50%;border:3px solid #fff;box-shadow:0 6px 16px rgba(0,0,0,.25);object-fit:cover;transition:left .6s cubic-bezier(.2,.8,.2,1),bottom .6s cubic-bezier(.2,.8,.2,1);z-index:2;pointer-events:none}
.climb .flag{position:absolute;right:0;top:0;font-size:11px;font-weight:700;color:var(--muted);display:flex;gap:6px;align-items:center}
.climbtxt{min-height:48px;margin-top:12px}
.vflip .flip .f strong{font-size:19px;display:grid;gap:10px}
.vflip .vic{width:30px;height:30px}
.value svg{width:16px;height:16px}
.mission{font-family:var(--display);font-weight:800;color:var(--brand);font-size:clamp(22px,3vw,30px);line-height:1.2;max-width:34ch;margin:8px 0 0}
body.locked [data-home],body.locked #home{pointer-events:none}
body.locked .guide .back,body.locked .dock [data-home]{visibility:hidden}
@media (max-width:820px){.dirmsg{grid-template-columns:minmax(0,1fr)}.climb{height:250px}.climb button{font-size:10px;padding:6px 2px}.climb button span{overflow-wrap:anywhere}.climb button svg{width:18px;height:18px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

.bar .wrap{display:flex;align-items:center;gap:12px}
.cta-note{font-size:13px;color:var(--muted);margin-top:10px}

const MODS=[{"t": "Te damos la bienvenida", "ic": "hand", "min": 10, "d": "Nuestra misión, nuestros valores y unas palabras de Dirección y Gerencia.", "badge": "Bienvenida", "isNew": 0}, {"t": "Quiénes somos", "ic": "building", "min": 14, "d": "Un grupo, cuatro entidades, una misión común.", "badge": "Exploración", "isNew": 0}, {"t": "Quién es quién", "ic": "users", "min": 10, "d": "Las personas con las que vas a trabajar y a quién acudir.", "badge": "Conexión", "isNew": 0}, {"t": "Cómo trabajamos", "ic": "clock", "min": 15, "d": "Jornada, normas de la oficina y herramientas.", "badge": "Día a día", "isNew": 0}, {"t": "Normas que te afectan", "ic": "file", "min": 18, "d": "Vacaciones, permisos, bajas, desconexión y uso de la IA.", "badge": "Normas claras", "isNew": 0}, {"t": "Código y compromisos", "ic": "heart", "min": 10, "d": "Seis compromisos que compartimos todas las personas.", "badge": "Integridad", "isNew": 0}, {"t": "Ciberseguridad y protección de datos", "ic": "shield", "min": 15, "d": "Detecta el phishing, crea contraseñas seguras y cuida los datos.", "badge": "Ciberguardián", "isNew": 1}, {"t": "Crecer en ALDA", "ic": "sprout", "min": 10, "d": "Cómo te acompañamos y cómo puedes crecer con nosotros.", "badge": "Talento", "isNew": 0}, {"t": "Cierre y certificado", "ic": "award", "min": 10, "d": "Prueba final, certificado y checklist de tu primera semana.", "badge": "Graduación", "isNew": 0}];
const total=MODS.reduce((a,m)=>a+m.min,0);
function home(){
  const first=START_URL||MODULE_URLS[0]||'#ruta';
  return `<section class="hero"><div class="txt"><span class="eyebrow">Tu incorporación</span><h1>Te damos la bienvenida a <em>ALDA</em></h1><p>Todo lo que necesitas para tu primera semana, en módulos cortos, con retos y con Alda, que te guía y responde tus dudas.</p>
   <div class="ctas"><a class="btn light" href="${first}" style="text-decoration:none">Empezar · ${MODS[0].t} ${ic('arrowR')}</a></div></div>
   <div class="stagebox"><span class="floor"></span><div><div class="bubble tail-down" id="hB"><span>¡Hola! Soy <b>Alda</b>. Te acompaño en tu incorporación: 9 módulos cortos, retos y puntos. ¿Empezamos?</span></div></div>${alda('wave','hA')}</div></section>
  <div class="summary"><div class="sum"><span class="si">${ic('book')}</span><div><b>9</b><small>módulos</small></div></div><div class="sum"><span class="si">${ic('clock')}</span><div><b>${total} min</b><small>en total</small></div></div><div class="sum"><span class="si">${ic('star')}</span><div><b>Puntos</b><small>por cada reto</small></div></div><div class="sum"><span class="si">${ic('award')}</span><div><b>9</b><small>insignias y certificado</small></div></div></div>
  <div class="sh" id="ruta"><div><h2>Tu ruta</h2><p>Te recomendamos seguir el orden. Cada módulo da puntos y una insignia.</p></div></div>
  <div class="route" id="route">${MODS.map((m,i)=>{const u=MODULE_URLS[i];const tag=i===0?'<span class="tag next">Empieza aquí</span>':m.isNew?'<span class="tag new">Nuevo</span>':'<span class="tag">Módulo</span>';
    const inner=`<span class="ic">${ic(m.ic)}</span><h3>${m.t}</h3><p>${m.d}</p><span class="meta"><span>Módulo ${i+1} · ${m.min} min</span>${tag}</span>`;
    return `<div class="stop ${i===0?'next':''}">${u?`<a class="mcard" href="${u}">${inner}</a>`:`<div class="mcard">${inner}</div>`}<span class="node">${i+1}</span></div>`}).join('')}</div>
  <div class="sh"><div><h2>Tus insignias</h2><p>Consigue las 9 y tu certificado de finalización</p></div></div>
  <div class="panelcard"><div class="badges">${MODS.map(m=>`<div class="badge"><span class="b">${ic(m.ic)}</span>${m.badge}</div>`).join('')}</div></div>`;
}
document.getElementById('app').innerHTML=home();
document.getElementById('brandlogo').src=IMG.alda_word;
</script>
