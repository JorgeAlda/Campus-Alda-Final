box .bubble b{color:#00403f}&#10;.hero .stagebox .bubble.tail-down::after{background:#ffffff;border-color:transparent}&#10;.hero .stagebox .say-tools button{background:#ffffff;color:#00403f;border-color:transparent}&#10;.hero .stagebox .alda{width:min(330px,88%);margin:14px auto 0}&#10;.hero .floor{position:absolute;left:0;right:0;bottom:0;height:22%;background:linear-gradient(transparent,rgba(0,0,0,.18))}&#10;.summary{margin-top:16px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}&#10;.sum{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;align-items:center;gap:12px;min-width:0}&#10;.sum svg.ring{width:52px;height:52px;flex:none}&#10;.sum b{font-family:var(--display);font-size:22px;line-height:1;display:block;font-variant-numeric:tabular-nums}&#10;.sum small{color:var(--muted);font-size:12.5px}&#10;.sum .si{width:40px;height:40px;border-radius:12px;background:var(--mint);color:var(--brand);display:grid;place-items:center;flex:none}&#10;.sum .si svg{width:22px;height:22px}&#10;.sh{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:40px 0 16px;flex-wrap:wrap}&#10;.sh h2{font-size:26px;font-weight:700}&#10;.sh p{color:var(--muted);font-size:14.5px}&#10;&#10;/* route */&#10;.route{position:relative;display:grid;gap:18px;padding-block:6px}&#10;.route::before{content:&quot;&quot;;position:absolute;left:50%;top:20px;bottom:20px;width:4px;margin-left:-2px;background:repeating-linear-gradient(var(--sand-2) 0 10px,transparent 10px 18px);border-radius:4px}&#10;.route .fill{position:absolute;left:50%;top:20px;width:4px;margin-left:-2px;background:var(--brand);border-radius:4px;transition:height .8s}&#10;.stop{display:grid;grid-template-columns:minmax(0,1fr) 64px minmax(0,1fr);align-items:center;position:relative}&#10;.stop .node{grid-column:2;justify-self:center;width:56px;height:56px;border-radius:50%;background:var(--surface);border:3px solid var(--sand-2);display:grid;pla lor:var(--brand)}&#10;.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:12px}&#10;.badge{text-align:center;font-size:12px;color:var(--muted);display:grid;gap:6px;justify-items:center}&#10;.badge .b{width:62px;height:62px;border-radius:20px;display:grid;place-items:center;background:var(--sand);color:var(--muted);border:2px dashed var(--line);transform:rotate(45deg)}&#10;.badge .b svg{width:26px;height:26px;transform:rotate(-45deg)}&#10;.badge.on .b{background:var(--spark-soft);color:var(--spark);border:2px solid var(--spark)}&#10;.badge.on{color:var(--ink);font-weight:600}&#10;.panelcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px}&#10;&#10;/* ---------- player (lesson) ---------- */&#10;.player{display:grid;grid-template-columns:270px minmax(0,1fr);gap:28px;padding-block:24px 130px;align-items:start}&#10;.guide{position:sticky;top:calc(84px + env(safe-area-inset-top,0px));display:grid;gap:4px}&#10;.guide .alda{width:100%}&#10;.guide .back{justify-self:start;margin-bottom:8px}&#10;.slide{display:grid;gap:18px;min-width:0}&#10;.shead{display:grid;gap:8px}&#10;.shead .top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}&#10;.shead h1{font-size:clamp(26px,3.4vw,38px);font-weight:700}&#10;.shead .stitle{font-family:var(--display);font-weight:600;color:var(--muted);font-size:16px}&#10;.enter{animation:enter .45s cubic-bezier(.2,.8,.2,1)}&#10;@keyframes enter{from{opacity:.0;transform:translateY(14px)}to{opacity:1;transform:none}}&#10;.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:24px;min-width:0}&#10;.card h3{font-size:19px;font-weight:600;margin-bottom:12px}&#10;.grid{display:grid;gap:14px}&#10;.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr))}&#10;.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}&#10;.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr))}&#10;.dock{position:fixed; ;, &quot;#000000&quot;], [&quot;Factoría de Cohesión&quot;, &quot;#06704c&quot;], [&quot;Turitech&quot;, &quot;#0064A4&quot;]];&#10;Object.assign(ICP,{film:'<rect x=&quot;2&quot; y=&quot;2&quot; width=&quot;20&quot; height=&quot;20&quot; rx=&quot;2.2&quot;/><path d=&quot;M7 2v20M17 2v20M2 12h20M2 7h5M2 17h5M17 17h5M17 7h5&quot;/>',sign:'<path d=&quot;M12 3v18M5 5h12l3 3-3 3H5zM9 13H6l-2 2 2 2h3&quot;/>'});&#10;const PHO=(k,alt,t,s)=>`<figure class=&quot;pho&quot;><img src=&quot;${PH[k]}&quot; alt=&quot;${alt}&quot;><figcaption><b>${t}</b><span>${s}</span></figcaption></figure>`;&#10;const PHP=(k,alt)=>`<figure class=&quot;php&quot;><img src=&quot;${PH[k]}&quot; alt=&quot;${alt}&quot;></figure>`;&#10;const PHA=(k,alt)=>`<figure class=&quot;pha&quot;><img src=&quot;${PH[k]}&quot; alt=&quot;${alt}&quot;></figure>`;&#10;/* ---------- guide lines (what Alda says on each step) ---------- */&#10;const GUIDE=[&#10; [['Hola, soy <b>Alda</b>, tu guía. Empezamos por lo esencial: <b>para qué existimos</b> y los nueve valores que nos guían. Gira cada tarjeta.','wave'],['Ahora, unas palabras de quienes dirigen ALDA: <b>Daniel y Alberto</b>, nuestros socios directores.','point'],['Te cuento la historia de <b>Claudia</b>, nuestra gerente. <b>Toca cada peldaño</b> de su camino y luego te pregunto.','wave'],['¿Sabrías reconocer nuestros valores en el día a día? <b>Arrastra cada acción</b> a su valor.','point']],&#10; [['ALDA acompaña e impulsa a personas y organizaciones. Somos <b>un grupo de cuatro entidades</b>: toca cada una para conocerla.','point'],['Pulsa <b>Reproducir</b> y recorre nuestra historia, o toca cada hito.','point'],['Estos son algunos de nuestros proyectos. <b>Filtra por entidad</b> y descúbrelos.','point'],['Reto: coloca cada proyecto en su entidad. Puedes <b>arrastrarlo</b>, o tocarlo y después tocar la entidad.','point'],['Y para estar al día: <b>síguenos</b> en la web y en LinkedIn de cada entidad.','wave']],&#10; [['Estas son las personas con las que vas a trabajar. Elige <b>qué necesitas</b> y te señalo a quién acudir.','point'],['¿A quién acudes en cada caso? Coloca cada situación con su persona o área.','point']],&#10; [['Mueve el reloj y mira <b>cómo es un día</b> en ALDA: entrada, fichaje, descanso y desconexión.','point'],['Compartimos espacio: estas son las <b>normas de la oficina</b>. Gira cada tarjeta y después haz el reto.','point'],['Estas son tus herramientas. Toca cada una y después responde las dos preguntas.','point']],&#10; [['Primero, <b>cómo se piden las vacaciones</b>, paso a paso. Después, nueve dudas frecuentes: <b>gira cada tarjeta</b>.','point'],['La vida pasa: <b>toca cada situación</b> y te digo qué permiso tienes y qué hacer.','point'],['Ahora vivimos tu <b>primer mes</b> en un chat. Elige cómo responderías en cada situación.','wave']],&#10; [['El Código de Conducta se nota en el día a día. Decide qué harías en cada situación.','point'],['Tres situaciones más. Completa los <b>seis compromisos</b> para conseguir la insignia.','point']],&#10; [['Casi todos los incidentes empiezan con un clic. Repasa las <b>seis reglas</b>: toca cada pestaña.','point'],['Esta es tu bandeja de práctica. Abre cada correo y decide: <b>¿phishing o legítimo?</b>','point'],['Escribe una contraseña de ejemplo, nunca la tuya, y mira cómo cambia el candado.','point']],&#10; [['Aquí te acompañamos para que crezcas. Este es <b>tu primer año</b> con nosotros.','wave'],['Nuestra gerente empezó en prácticas. Cuéntanos qué quieres aprender y dónde te ves.','point']],&#10; [['¡Última prueba! <b>Diez preguntas</b>, una a una. Necesitas ocho aciertos.','point'],['Marca lo que ya tienes listo de tu <b>primera semana</b>. Si te falta algo, escribe a RRHH.','point']]&#10;];&#10;&#10;/* ---------- modules ---------- */&#10;const MODS=[&#10;{t:'Te damos la bienvenida',ic:'hand',min:10,d:'Nuestra misión, nuestros valores y unas palabras de Dirección y Gerencia.',req:['m0a','m0v'],badge:'Bienvenida',steps:[&#10; ['Misión y valores',()=>`<d iv>`],&#10; ['Mensaje de la Gerencia',()=>`<div class=&quot;card grid g2&quot;><div class=&quot;grid&quot; style=&quot;gap:10px;align-content:start&quot;><span class=&quot;eyebrow&quot;>Mensaje de la Gerencia</span><div class=&quot;dirph&quot;><img src=&quot;${PH.claudia}&quot; alt=&quot;Claudia Lorenzo, gerente general&quot;></div><p class=&quot;lead&quot; style=&quot;margin:0&quot;>Quiero compartir contigo una historia que refleja el compromiso real con el crecimiento profesional en nuestra empresa: la mía.</p>&#10;  <p class=&quot;lead&quot; style=&quot;margin:0&quot;>Animo a cada persona que se incorpora a ALDA a explorar las oportunidades de crecimiento y desarrollo que ofrecemos. Confío en que tu tiempo con nosotros será tan enriquecedor como lo ha sido para mí.</p><p class=&quot;sign&quot;><b>Claudia Lorenzo</b> · Gerente general</p></div>&#10;  <div><span class=&quot;eyebrow&quot;>Su camino · toca cada peldaño</span><div class=&quot;climb&quot; id=&quot;climb&quot; style=&quot;margin-top:10px&quot;>${CLIMB.map((c,i)=>`<button type=&quot;button&quot; data-cl=&quot;${i}&quot;>${ic(['sprout','file','users','award'][i])}<span>${c[0]}</span></button>`).join('')}<img class=&quot;climbme&quot; id=&quot;climbme&quot; src=&quot;${PH.claudia}&quot; alt=&quot;&quot;></div><p class=&quot;climbtxt lead&quot; id=&quot;climbtxt&quot; aria-live=&quot;polite&quot;></p></div></div>&#10;  ${Q('m0a','¿Cómo empezó Claudia, nuestra gerente, en ALDA?',['Como directora de una de las entidades','En prácticas','Como consultora externa'],1,'¡Exacto! De prácticas a gerente general. Aquí se crece.','Pista: toca el primer peldaño de su camino.','Pregunta rápida')}`],&#10; ['Valores en acción',()=>`<div class=&quot;grid g3 c3d&quot;>${[['clock','~90 min','En 9 módulos cortos. Puedes pausar cuando quieras.','a'],['star','Puntos e insignias','Ganas puntos e insignias con cada reto superado.','b'],['alda','Alda, tu guía','Te acompaña en cada paso y responde tus dudas, abajo a la derecha.','c']].map(c=>`<div class=&quot;t3d t3${c[3]}&quot;><div class=&quot;t3in&quot;>${c[0]==='alda'?`<img class=&quot;t3m&quot; src=&quot;${MASCOT.body}&quot; alt=&quot;&quot;>`:`<span class=&quot;t3i&quot;>${ic(c[0])}</span>`}<b>${c[1]}</b><span>${c[2]}</span></div></div>`).join('')}</div>&#10;  <div class=&quot;card&quot;><h3>Reto: ¿qué valor hay detrás de cada acción?</h3>${M('m0v',[['Respiro y decido con calma, aunque haya prisa',0],['Propongo mejorar un proceso que «siempre se ha hecho así»',1],['Me coordino con otra unidad para ir en la misma dirección',2],['Ante un correo tenso, respondo con criterio y sin prisas',0],['Busco una forma mejor de hacerlo',1],['Comparto lo que sé para que el equipo avance',2]],['Serenidad','Inconformismo','Cohesión'],['#00403f','#000000','#06704c'])}</div>`]&#10;]},&#10;{t:'Quiénes somos',ic:'building',min:14,d:'Un grupo, cuatro entidades, una misión común.',req:['m1m','m1a'],badge:'Exploración',steps:[&#10; ['Qué es ALDA',()=>`<div class=&quot;card whoami&quot; style=&quot;--wm:url(${IMG.alda_word})&quot;><span class=&quot;eyebrow&quot;>Qué es ALDA</span><p class=&quot;big&quot; style=&quot;margin-top:8px;max-width:40ch&quot;>Una marca de profesionales que acompaña, apoya e impulsa a personas, proyectos y organizaciones en sus procesos de crecimiento, transformación y creación de valor.</p>&#10;  <div class=&quot;values&quot;>${VALS.map(v=>`<span class=&quot;value&quot;>${ic(v[2])}${v[0]}</span>`).join('')}</div></div>&#10;  <div class=&quot;explorer&quot; data-explorer><div class=&quot;ctabs&quot; role=&quot;tablist&quot; aria-label=&quot;Entidades del grupo&quot;>${COMP.map((c,i)=>`<button class=&quot;ctab&quot; role=&quot;tab&quot; aria-selected=&quot;${i===0}&quot; data-ct=&quot;${i}&quot; style=&quot;--c:${c[1]}&quot;><i></i>${c[0]}</button>`).join('')}</div><div class=&quot;cpanel&quot; id=&quot;cpanel&quot; role=&quot;tabpanel&quot; aria-live=&quot;polite&quot;></div></div>`],&#10; ['Nuestra historia',()=>`<div class=&quot;card 0; ['Permisos, bajas y seguridad',()=>`<div class=&quot;card grid&quot; style=&quot;gap:12px&quot;><span class=&quot;eyebrow&quot;>¿Qué te ha pasado?</span><p class=&quot;lead&quot; style=&quot;margin:0&quot;>Toca una situación y te digo qué hacer.</p><div class=&quot;needs&quot;>${PERM.map((p,i)=>`<button class=&quot;need&quot; aria-pressed=&quot;false&quot; data-perm=&quot;${i}&quot;>${p[0]}</button>`).join('')}</div><div class=&quot;daycard&quot; id=&quot;permout&quot; aria-live=&quot;polite&quot;></div><p class=&quot;note&quot;>RRHH te confirma los días exactos de cada permiso.</p></div>&#10;  <div class=&quot;card grid g2&quot; style=&quot;align-items:center&quot;><div class=&quot;grid&quot; style=&quot;gap:8px&quot;><span class=&quot;eyebrow&quot;>Seguridad en la oficina</span><p class=&quot;big&quot; style=&quot;font-size:21px&quot;>El primer día, localiza las salidas de emergencia, los extintores y el botiquín.</p><p class=&quot;lead&quot; style=&quot;margin:0&quot;>La oficina cuenta con <b>botiquín de primeros auxilios</b>. No bloquees pasillos ni salidas y, si hay un accidente o ves un riesgo, por pequeño que sea, avisa a RRHH.</p></div><div class=&quot;grid g2&quot;>${stat('alert','Salidas','Siempre libres, sin cajas ni cables')}${stat('shield','Botiquín','De primeros auxilios en la oficina. Pregunta dónde está el primer día')}</div></div>&#10;  ${Q('m4p','El médico te da la baja por enfermedad.',['Espero a volver para contarlo','Aviso cuanto antes a mi coordinación o PM y a RRHH','Solo se lo digo a una persona del equipo'],1,'Así se puede organizar el trabajo. El parte ya no tienes que entregarlo.','Avisa cuanto antes a tu coordinación o PM y a RRHH.','Bajas')}`],&#10; ['Tu primer mes',()=>`<div class=&quot;card&quot;><h3>Escenario: tu primer mes</h3><div class=&quot;chat&quot; id=&quot;scene&quot; aria-live=&quot;polite&quot;></div></div>`]&#10;]},&#10;{t:'Código y compromisos',ic:'heart',min:10,d:'Seis compromisos que compartimos todas las personas.',req:['m5a','m5b','m5c','m5d','m5e','m5f'],badge:'Integridad',steps:[&#10; ['Tres primeros compromisos',()=>`${PHO('codigo','Equipo de ALDA revisando un proyecto','Integridad en cada decisión','Así se traducen nuestros valores en el día a día.')}<div class=&quot;card&quot;><span class=&quot;eyebrow&quot;>Código de Conducta</span><p class=&quot;big&quot; style=&quot;margin-top:8px;max-width:40ch&quot;>Lo seguimos todas las personas del grupo: plantilla, Dirección, personas en prácticas y colaboradoras.</p><p class=&quot;lead&quot; style=&quot;margin-top:8px&quot;>Traduce nuestros valores en acciones concretas con el equipo, la clientela y las empresas proveedoras.</p></div>&#10;  <div class=&quot;card&quot;><div class=&quot;commit&quot; id=&quot;commit&quot;></div></div>&#10;  ${Q('m5a','Ves un cable cruzando el pasillo.',['Paso por encima','Lo retiro o aviso para que se retire','No es mi tarea'],1,'La seguridad es cosa de todas las personas.','La prevención empieza por avisar.','La seguridad como un deber')}&#10;  ${Q('m5b','Una persona del equipo hace bromas repetidas sobre el físico de otra.',['Me río para no quedar mal','Lo comunico a RRHH según el protocolo','Lo comento con el resto'],1,'Tolerancia cero: RRHH es el canal.','Callar o comentarlo no lo resuelve.','Un entorno libre de acoso')}&#10;  ${Q('m5c','En una selección proponen descartar a una candidatura «porque tiene hijos pequeños».',['Es discriminación: el criterio no es válido','Es prudente','Depende del puesto'],0,'Igualdad de trato en selección, retribución y promoción.','Ese criterio es discriminatorio.','Un entorno igualitario')}`],&#10; ['Tres compromisos más',()=>`<div class=&quot;card&quot;><div class=&quot;commit&quot; id=&quot;commit&quot;></div></div>&#10;  ${Q('m5d','Te levantas a por un café.',['Bloqueo el ordenador (Win + L)','Lo dejo abierto, vuelvo en un minuto'],0,'Protegemos los datos.','Una pantalla abierta expone datos.','La privacidad importa')}&#10;  ${Q('m5e','Necesitas una foto para quot;><legend class=&quot;qt&quot; style=&quot;margin-bottom:12px&quot;>${f[0]}</legend><div class=&quot;opts&quot;>${f[1].map((o,j)=>`<button type=&quot;button&quot; class=&quot;opt&quot; data-j=&quot;${j}&quot;${ans[q]===j?' style=&quot;border-color:var(--brand);background:var(--mint)&quot;':''}><span class=&quot;l&quot;>${'abc'[j]}</span><span>${o}</span></button>`).join('')}</div></fieldset>&#10;     <div style=&quot;display:flex;justify-content:space-between;gap:10px&quot;>${q>0?`<button class=&quot;btn ghost&quot; id=&quot;fqp&quot;>${ic('arrowL')} Anterior</button>`:'<span></span>'}<button class=&quot;btn${q===FQ.length-1?' spark':''}&quot; id=&quot;fqn&quot;${ans[q]===undefined?' disabled':''}>${q===FQ.length-1?'Enviar respuestas':'Siguiente'} ${ic('arrowR')}</button></div></div>`;&#10;    box.querySelectorAll('[data-j]').forEach(b=>b.onclick=()=>{ans[q]=+b.dataset.j;draw()});&#10;    const p=document.getElementById('fqp');if(p)p.onclick=()=>{q--;draw()};&#10;    document.getElementById('fqn').onclick=()=>{if(ans[q]===undefined)return;if(q<FQ.length-1){q++;draw();return}&#10;      let n=0;FQ.forEach((f,i)=>{if(ans[i]===f[2])n++});S.ans.final={n,got:n>=8?1:0};if(n>=8)addPts(50,'Prueba final superada');save();drawFinal();afterAnswer()};&#10;  };draw();&#10;}&#10;function wireChecks(){&#10;  const cs=[...document.querySelectorAll('[data-ck]')];&#10;  const upd=()=>{const n=cs.filter(c=>c.checked).length;document.getElementById('ckn').textContent=`${n} de ${cs.length} listas`;document.getElementById('ckm').style.width=(n/cs.length*100)+'%';return n};&#10;  cs.forEach(c=>{const k='ck'+c.dataset.ck;c.checked=!!S.ans[k];c.onchange=()=>{S.ans[k]=c.checked;save();if(upd()===cs.length)react(true,'¡Primera semana completa! Bienvenida al equipo.')}});upd();&#10;}&#10;&#10;/* ---------- voice toggle ---------- */&#10;function drawVoice(){const b=document.getElementById('voice');if(!canSpeak){b.hidden=true;return}&#10;  b.setAttribute('aria-pressed',S.voice?'true':'false');b.innerHTML=ic(S.voice?'vol':'volx');const t=S.voice?&quot;Silenciar la voz de Alda&quot;:&quot;Activar la voz de Alda&quot;;b.title=t;b.setAttribute(&quot;aria-label&quot;,t)}&#10;document.getElementById('voice').onclick=()=>{S.voice=!S.voice;save();drawVoice();if(!S.voice){try{speechSynthesis.cancel()}catch(e){}}else if(lastSay)say(...lastSay)};&#10;const KB='';&#10;const FAQ=[&#10;    [['vacacion'],'Las vacaciones se piden por correo a tu coordinación directa o a la Project Manager de tu unidad, y a RRHH, con 2 meses de antelación y en periodos de mínimo 3 días.'],&#10;    [['asunto','propio'],'Los asuntos propios se piden por correo y no se pueden unir a las vacaciones.'],&#10;    [['horario','hora','entrar','jornada','flexib'],'El horario general es de 8:00 a 16:00. Puedes entrar hasta una hora antes avisando antes a tu responsable y a RRHH.'],&#10;    [['teletrabaj','casa','remoto'],'Tienes 1 día de teletrabajo a la semana; tu PM envía el calendario cada mes. En ALDA Productions es optativo bajo solicitud.'],&#10;    [['fich','bixpe','registro'],'Registras tu jornada cada día en Bixpe, también cuando teletrabajas.'],&#10;    [['nómina','nomina','fin de mes','firma'],'Puedes descargar tus nóminas en tu zona personal de Holded. A fin de mes entregas a RRHH firmados tu nómina y tu registro horario.'],&#10;    [['extra'],'Las horas extra se solicitan antes a tu responsable y a RRHH para planificar su compensación.'],&#10;    [['descanso','pausa','café','cafe'],'Tienes 30 min de descanso en jornadas de más de 4 h y 15 min si son de 4 h o menos.'],&#10;    [['holded','tarea','proyecto'],'En Holded ves tus tareas, registras tus horas por proyecto y, en tu zona personal, descargas tus nóminas. Te llega una invitación al correo.'],&#10;    [['reuni','calendar','agenda','convocatoria'],'Las reuniones se agendan en Google Calendar: ahí recibes las convocatorias y consultas tu agenda.'],&#10;    [['correo','cuenta','acceso','ordenador','portátil','informátic'],'Para correo, accesos u ordenador, escribe a RRHH y se gestiona con soporte informático.'],&#10;    [['contraseña','password','clave'],'Usa contraseñas de al menos 12 caracteres (mejor una frase), una distinta por servicio, y activa la verificación en dos pasos. Nunca las compartas.'],&#10;    [['phishing','sospech','enlace','clic','hacke','virus','robado','perdido','perdí'],'No hagas clic en enlaces sospechosos. Si ya lo hiciste o perdiste un dispositivo, avisa en el momento a RRHH y a soporte informático.'],&#10;    [['dato','rgpd','privacidad','dni','protección'],'Usa solo los datos necesarios y siempre en sistemas corporativos: nunca por WhatsApp ni cuentas personales. La confidencialidad sigue al terminar tu contrato.'],&#10;    [['ia','chatgpt','inteligencia','copilot','claude'],'Usa solo herramientas de IA autorizadas y nunca con datos personales, de clientes o confidenciales.'],&#10;    [['desconex','whatsapp','noche','fin de semana'],'Fuera de tu jornada tienes derecho a desconectar. Solo lo urgente justifica un contacto.'],&#10;    [['acoso','discrimin','respeto','igualdad'],'Ante cualquier situación de acoso o trato inadecuado, comunícalo a RRHH según el protocolo. Tolerancia cero.'],&#10;    [['formaci','crecer','carrera','evaluaci','desarrollo'],'Tienes 20 h de formación al año, feedback continuo y evaluación del desempeño. Si quieres crecer, háblalo con tu PM o con RRHH.'],&#10;    [['irme','baja','dimisi','dejar','preaviso','salida','liquidaci','finiquito'],'Las solicitudes de salida se hacen a través de Microsoft, con 15 días de preaviso. La solicitud de liquidación previa también se hace a través de Microsoft.'],&#10;    [['oficina','dirección','direccion','dónde','donde'],'Estamos en Av. Francisco La Roche 37, Edificio Atlántico, 1ºB, Santa Cruz de Tenerife.'],&#10;    [['empresa','grupo','consulting','productions','factor','turitech'],'El grupo ALDA reúne cuatro entidades: ALDA Projects (consultoría), ALDA Productions, Factoría de Cohesión y Turitech.'],&#10;    [['misión','mision'],'Nuestra misión: descubrir y activar el talento de personas y organizaciones para potenciar su capacidad de crear valor.'],&#10;    [['valor'],'Nuestros valores son: serenidad, empatía, disciplina, confianza, cohesión, inconformismo, responsabilidad, audacia y creatividad.']&#10;  ];&#10;const SUGS=['¿Cómo pido vacaciones?','¿Qué hago si hice clic en un enlace raro?','¿Puedo usar ChatGPT?','¿Cuántos días teletrabajo?'];&#10;let sample=null, turns=[], ctl=null;&#10;const RULES=`Eres «Alda IA», el asistente del campus de incorporación del Grupo ALDA. Responde en español, tuteando, con lenguaje inclusivo (evita el masculino genérico: usa «el equipo», «las personas», «la plantilla»), en un tono cercano y profesional, en un máximo de 90 palabras y sin formato Markdown. Responde SOLO con la información de esta base; si la respuesta no está, dilo y sugiere escribir a RRHH (rrhh@aldaprojects.com). No inventes datos.\n\nBASE DE CONOCIMIENTO:\n${KB}`;&#10;function localAnswer(q){q=q.toLowerCase();let best=null,sc=0;FAQ.forEach(([ks,a])=>{const s=ks.filter(k=>q.includes(k)).length;if(s>sc){sc=s;best=a}});return best||'No tengo esa respuesta aquí. Escríbele a RRHH (rrhh@aldaprojects.com) y te ayudan.'}&#10;function addMsg(who,t,sub){const m=document.createElement('div');m.className='msg '+who;m.textContent=t;if(sub){const s=document.createElement('small');s.textContent=sub;m.appendChild(s)}const box=document.getElementById('msgs');box.appendChild(m);box.scrollTop=box.scrollHeight;return m}&#10;function openAI(){const p=document.getElementById('panel');p.hidden=false;document.getElementById('fab').setAttribute('aria-expanded','true');&#10;  if(!document.getElementById('msgs').children.length)addMsg('ai','¡Hola! Soy Alda. Pregúntame sobre vacaciones, horarios, herramientas, salidas, ciberseguridad o protección de datos.');&#10;  document.getElementById('sugs').innerHTML=SUGS.map(s=>`<button>${s}</button>`).join('');&#10;  document.querySelectorAll('#sugs button').forEach(b=>b.onclick=()=>ask(b.textContent));&#10;  document.getElementById('ask').focus()}&#10;function closeAI(){document.getElementById('panel').hidden=true;document.getElementById('fab').setAttribute('aria-expanded','false');ctl?.abort()}&#10;async function ask(q){&#10;  q=q.trim();if(!q)return;document.getElementById('ask').value='';addMsg('me',q);&#10;  if(!sample){addMsg('ai',localAnswer(q));return}&#10;  const bubble=addMsg('ai','Pensando…');ctl=new AbortController();turns.push({role:'user',content:q});&#10;  try{const {text}=await sample([{role:'user',content:RULES},...turns.slice(-8)],{cache:false,modelTier:'quick',signal:ctl.signal,onText:({text})=>{bubble.textContent=text}});&#10;    turns.push({role:'assistant',content:text});}&#10;  catch(e){turns.pop();if(e.code==='cancelled'){bubble.textContent=e.text||'Cancelado.';return}&#10;    if(['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(e.code))sample=null;&#10;    bubble.textContent=localAnswer(q);const s=document.createElement('small');s.textContent='Respuesta rápida';bubble.appendChild(s)}&#10;}&#10;function wireExplain(root){&#10;  const w=root.querySelector('[data-ai-wrap]');if(!w)return;w.hidden=!sample;&#10;  const b=w.querySelector('[data-ai-explain]'),o=w.querySelector('[data-ai-out]');&#10;  b.onclick=async()=>{if(!sample)return;b.disabled=true;o.hidden=false;o.textContent='Pensando…';&#10;    const txt=document.getElementById('stage').innerText.slice(0,3500);&#10;    try{await sample(`Eres Alda IA. Explica de forma muy sencilla, en español, con lenguaje inclusivo y tuteando, esta pantalla de un curso de incorporación. Da: 3 ideas clave en frases cortas y 1 ejemplo práctico de su primera semana. Máximo 90 palabras, sin Markdown.\n\nPANTALLA:\n${txt}`,{modelTier:'quick',onText:({text})=>{o.textContent=text}})}&#10;    catch(e){o.textContent=e.text||'Ahora no puedo explicarlo. Pregúntame desde el asistente.';if(e.code==='not_granted')w.hidden=true}&#10;    finally{b.disabled=false}};&#10;}&#10;document.getElementById('brandlogo').src=IMG.alda_word;&#10;document.getElementById('fabimg').src=MASCOT.body;document.getElementById('panelimg').src=MASCOT.body;&#10;document.getElementById('fab').onclick=()=>document.getElementById('panel').hidden?openAI():closeAI();&#10;document.getElementById('closeAI').onclick=closeAI;&#10;document.getElementById('compose').onsubmit=e=>{e.preventDefault();ask(document.getElementById('ask').value)};&#10;document.getElementById('home').onclick=()=>{S.view='home';save();render(true)};&#10;document.addEventListener('keydown',e=>{&#10;  if(e.key==='Escape'&amp;&amp;!document.getElementById('panel').hidden){closeAI();return}&#10;  if(S.view!=='lesson'||!document.getElementById('panel').hidden)return;&#10;  const t=e.target;if(t&amp;&amp;(/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)||t.isContentEditable))return;&#10;  if(e.key==='ArrowRight')goStep(S.step+1);if(e.key==='ArrowLeft')goStep(S.step-1);&#10;});&#10;function fromHash(){const h=(location.hash||'').toLowerCase();const m=h.match(/^#m([1-9])$/);&#10;  if(m){S.view='lesson';S.mod=+m[1]-1;S.step=0;return true}if(h==='#inicio'){S.view='home';return true}return false}&#10;fromHash();&#10;window.addEventListener('hashchange',()=>{if(fromHash()){save();render(true)}});&#10;drawVoice();render();&#10;</script>&#10;&#10;</body></html>"></iframe>
